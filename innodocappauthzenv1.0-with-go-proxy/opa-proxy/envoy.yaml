static_resources:
  # =========================
  # LISTENERS
  # =========================
  listeners:
    - name: authzen_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080   # Envoy will accept inbound HTTP on this port

      filter_chains:
        - filters:
            # Envoy's HTTP Connection Manager is the "L7 brain":
            # it terminates HTTP, runs HTTP filters, then routes to clusters.
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: authzen_proxy

                # =========================
                # ROUTING
                # =========================
                # Route inbound paths to the OPA cluster and rewrite the prefix
                route_config:
                  name: authzen_routes
                  virtual_hosts:
                    - name: opa
                      domains: ["*"]

                      routes:
                        # Incoming:  /access/v1/evaluation...
                        # Upstream:  /v1/data/evaluation...
                        - match:
                            prefix: /access/v1/evaluation
                          route:
                            cluster: opa
                            prefix_rewrite: /v1/data/evaluation

                        - match:
                            prefix: /access/v1/evaluations
                          route:
                            cluster: opa
                            prefix_rewrite: /v1/data/evaluations

                        # Incoming:  /access/v1/resource_search...
                        # Upstream:  /v1/data/resource_search...
                        - match:
                            prefix: /access/v1/resource_search
                          route:
                            cluster: opa
                            prefix_rewrite: /v1/data/resource_search

                # =========================
                # HTTP FILTERS (ORDER MATTERS)
                # =========================
                http_filters:
                  # 1) Buffer request/response bodies so Lua can read/modify them reliably.
                  # Without this, handle:body() may be empty at filter execution time,
                  # especially with chunked transfer encoding or streaming.
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 1048576    # 1 MiB max request body to buffer

                  # 2) Lua filter to rewrite JSON bodies:
                  # - Request: wrap JSON into {"input": <original>}
                  # - Response: unwrap {"result": ...} to just the inner result JSON
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        local function trim(s)
                          return (s:gsub("^%s+", ""):gsub("%s+$", ""))
                        end

                        -- Wrap any JSON body into {"input": <body>} unless it already begins with {"input":
                        local function wrap_input(raw)
                          local t = trim(raw)
                          if t:match('^%{%s*"%s*input%s*"%s*:') then
                            return nil
                          end
                          if not (t:sub(1,1) == "{" or t:sub(1,1) == "[") then
                            return nil
                          end
                          return '{"input":' .. raw .. '}'
                        end

                        -- Generic: Unwrap {"<key>": ...} -> ...
                        -- Only matches when the wrapper is the *entire* top-level object.
                        local function unwrap_key(raw, key)
                          local t = trim(raw)
                          local pattern = '^%{%s*"%s*' .. key .. '%s*"%s*:%s*(.*)%s*%}%s*$'
                          local inner = t:match(pattern)
                          if inner == nil then
                            return nil
                          end
                          return inner
                        end

                        -- Unwrap {"result":...} and/or {"response":...}
                        -- If both are present as separate layers, unwrap repeatedly (bounded).
                        local function unwrap_wrappers(raw)
                          local current = raw
                          local changed = false

                          -- Unwrap up to N layers to avoid accidental infinite loops
                          for _ = 1, 3 do
                            local inner = unwrap_key(current, "result")
                            if inner ~= nil then
                              current = inner
                              changed = true
                              goto continue
                            end

                            inner = unwrap_key(current, "response")
                            if inner ~= nil then
                              current = inner
                              changed = true
                              goto continue
                            end

                            -- nothing matched this round
                            break

                            ::continue::
                          end

                          if not changed then
                            return nil
                          end
                          return current
                        end

                        function envoy_on_request(handle)
                          local headers = handle:headers()
                          headers:remove("accept-encoding")

                          local body = handle:body()
                          if body == nil or body:length() == 0 then return end

                          local raw = body:getBytes(0, body:length())
                          if raw == nil or raw == "" then return end

                          local new_body = wrap_input(raw)
                          if new_body == nil then return end

                          body:setBytes(new_body)
                          headers:replace("content-type", "application/json")
                          headers:replace("content-length", tostring(#new_body))
                        end

                        function envoy_on_response(handle)
                          local body = handle:body()
                          if body == nil or body:length() == 0 then return end

                          local raw = body:getBytes(0, body:length())
                          if raw == nil or raw == "" then return end

                          local new_body = unwrap_wrappers(raw)
                          if new_body == nil then return end

                          body:setBytes(new_body)

                          local headers = handle:headers()
                          headers:replace("content-type", "application/json")
                          headers:replace("content-length", tostring(#new_body))
                        end



                  # 3) The router filter must be last; it actually sends the request upstream.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # =========================
  # UPSTREAM CLUSTERS
  # =========================
  clusters:
    - name: opa
      # How long Envoy waits to establish a TCP connection to OPA
      connect_timeout: 0.25s

      # Resolve "opa" via Docker DNS; good for Compose service discovery
      type: STRICT_DNS

      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: pdp     # Docker Compose service name
                      port_value: 8181 # OPA port
