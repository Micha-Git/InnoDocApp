[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-token-service"
version = "1.0.0"
description = "Secure Token Service for EUDI Verifier Integration"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "sd-jwt @ git+https://github.com/openwallet-foundation-labs/sd-jwt-python.git",
    "requests",
    "pytest>=9.0.2",
    "pyjwt",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "black>=23.7.0", "pylint>=2.17.5"]
